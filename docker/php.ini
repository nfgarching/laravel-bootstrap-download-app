; Einstellungen für das Portal

expose_php = Off
memory_limit = 256M

; Datei-Uploads der API kommen roh im Anfragekörper und werden im Datenstrom
; verschlüsselt. Die Größenbegrenzung übernimmt die Anwendung (PORTAL_MAX_FILE_SIZE).
post_max_size = 0

; Downloads werden blockweise entschlüsselt und sofort ausgegeben.
output_buffering = Off
zlib.output_compression = Off

opcache.enable = 1
opcache.validate_timestamps = 0

session.cookie_httponly = 1
session.use_strict_mode = 1
